services:
  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_db
    ports:
      - "3306:3306"
    volumes:
      - hospital_mysql_db_data:/var/lib/mysql
      - ./db/1_schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/2_users.sql:/docker-entrypoint-initdb.d/2_users.sql
      - ./db/3_data.sql:/docker-entrypoint-initdb.d/3_data.sql

  redis:
    image: redis:6
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 1s
      retries: 5

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - langgraph-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s

  langgraph-api:
    image: ${IMAGE_NAME}
    ports:
      - "8123:8000"
    depends_on:
      - mysql
      - redis
      - postgres
    env_file:
      - ./.env
    environment:
      REDIS_URI: redis://redis:6379
      POSTGRES_URI: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable


volumes:
  hospital_mysql_db_data:
  data:
  config:
  langgraph-data:
    driver: local